<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Property Labels – Trimble Connect</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
  :root{
    --bg:#fff; --panel-bg:#f7f8fa; --border:#e2e4e8; --text:#1f2430; --text-muted:#6b7280;
    --accent:#2563eb; --radius:10px; --shadow:0 2px 10px rgba(0,0,0,.08);
    font-family:"Trimble Sans","Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-size:13px;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:14px;margin:0;font-weight:600;}
  .status{font-size:11px;color:var(--text-muted);}
  .toolbar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;padding:6px 10px;border-radius:8px;color:var(--text);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.danger{background:#dc2626;border-color:#dc2626;color:#fff;}
  button.ghost{background:transparent;border-color:transparent;color:var(--text-muted);}
  button.active{outline:2px solid var(--accent);}
  button:hover:not(:disabled){filter:brightness(0.97);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .hint{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;line-height:1.4;}
  .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .row > div{flex:1;min-width:0;}
  label{display:block;font-size:11.5px;color:var(--text-muted);margin:6px 0 3px;}
  input[type=text]{width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:#fff;}
  .swatches{display:flex;gap:6px;}
  .swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.selected{border-color:#000;}

  #picker{padding:12px;border-bottom:2px solid var(--accent);background:var(--panel-bg);display:none;max-height:70vh;overflow-y:auto;}
  #picker.open{display:block;}
  #picker h3{font-size:12.5px;margin:0 0 6px;}
  .objList{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
  .psetGroup{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;overflow:hidden;}
  .psetGroup .psetHead{padding:6px 8px;background:var(--panel-bg);font-weight:600;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .psetGroup .psetBody{padding:4px 8px 6px;}
  .propRow{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11.5px;}
  .propRow .pval{color:var(--text-muted);margin-left:auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}

  #listHeader{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel-bg);}
  #listHeader .count{font-size:11.5px;color:var(--text-muted);}
  #list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
  .empty{color:var(--text-muted);text-align:center;margin-top:40px;font-size:12px;}
  .lbl-card{border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;background:#fff;}
  .lbl-card.hidden-label{opacity:.5;}
  .lbl-card .head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card-color, var(--accent));color:#fff;}
  .lbl-card .head .title{font-weight:600;font-size:12.5px;flex:1;}
  .lbl-card .body{padding:8px 10px;font-size:11.5px;color:var(--text-muted);}
  .lbl-card .body div{display:flex;justify-content:space-between;padding:1px 0;gap:8px;}
  .lbl-card .body .v{color:var(--text);font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lbl-card .foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding:6px 10px;border-top:1px solid var(--border);}
  .lbl-card .foot button{padding:3px 7px;font-size:10.5px;border-radius:6px;}

  #debugLog{font-size:10.5px;color:var(--text-muted);padding:6px 12px;border-top:1px solid var(--border);max-height:150px;overflow-y:auto;white-space:pre-wrap;display:none;}
  #debugLog.open{display:block;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏷️ Property Labels</h1>
    <span class="status" id="status">Ansluter…</span>
  </header>

  <div class="toolbar">
    <button class="primary" id="btnCreate">+ Skapa label (markerat objekt)</button>
    <button class="ghost" id="btnUpdateAll">🔄 Uppdatera alla</button>
    <button class="ghost" id="btnDebugToggle">🐞 Rådata</button>
    <button class="ghost" id="btnDebugCopy">📋 Kopiera rådata</button>
    <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);margin:0;">
      <input type="checkbox" id="testModeNoDraw" /> 🧪 Testläge: hämta data men rita inget i 3D-vyn
    </label>
  </div>

  <div id="picker">
    <h3 id="pickerTitle">Välj egenskaper att visa</h3>
    <div class="objList" id="pickerObjList"></div>
    <div id="pickerGroups"></div>
    <label>Färg</label>
    <div class="swatches" id="pickerSwatches"></div>
    <div class="form-actions">
      <button class="ghost" id="btnPickerCancel">Avbryt</button>
      <button class="primary" id="btnPickerSave">Skapa label(er)</button>
    </div>
  </div>

  <div id="listHeader">
    <span class="count" id="lblCount">0 labels</span>
  </div>
  <div id="list"></div>
  <div id="debugLog"></div>
</div>

<script>
(function(){
  const COLORS = ["#2563eb","#d7263d","#059669","#d97706","#7c3aed","#0891b2"];

  let API = null;
  let currentModelIdGuess = null;
  let debugOn = false;
  let debugBuffer = "";

  let labels = []; // saved labels, see renderLabelList
  let nextLabelId = 1;

  // Picker (create/edit) state
  let pickerMode = "create"; // 'create' | 'edit'
  let pickerObjects = [];    // [{ modelId, objectRuntimeId, title, psets: [...], flatProps: Map(key -> {psetName,propName,value}) }]
  let pickerSelectedKeys = new Set(); // "psetName||propName"
  let pickerColor = COLORS[0];
  let editingLabel = null; // when pickerMode === 'edit'
  let moveTargetLabel = null; // when waiting for a manual reposition click

  const el = id => document.getElementById(id);
  const statusEl = el("status");
  const debugLogEl = el("debugLog");
  const pickerEl = el("picker");

  function log(...args){
    console.log("[Property Labels]", ...args);
    const line = new Date().toLocaleTimeString() + " " + args.map(a=>{
      try{ return typeof a === "string" ? a : JSON.stringify(a); } catch(e){ return String(a); }
    }).join(" ") + "\n";
    debugBuffer = line + debugBuffer;
    if(debugOn) debugLogEl.textContent = debugBuffer;
  }
  el("btnDebugToggle").onclick = () => {
    debugOn = !debugOn;
    debugLogEl.classList.toggle("open", debugOn);
    el("btnDebugToggle").classList.toggle("active", debugOn);
    if(debugOn) debugLogEl.textContent = debugBuffer;
  };
  el("btnDebugCopy").onclick = async () => {
    const text = debugBuffer || "(loggen är tom — inga åtgärder har körts än sedan sidan laddades)";
    try { await navigator.clipboard.writeText(text); el("btnDebugCopy").textContent = "✅ Kopierat!"; }
    catch(err){
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:10%;left:5%;width:90%;height:70%;z-index:2000;font-size:11px;";
      document.body.appendChild(ta); ta.focus(); ta.select();
      el("btnDebugCopy").textContent = "Markera & Ctrl+C, stäng sen rutan";
      ta.addEventListener("blur", () => ta.remove(), { once:true });
    }
    setTimeout(() => { el("btnDebugCopy").textContent = "📋 Kopiera rådata"; }, 2500);
  };

  function buildSwatches(container, onPick, active){
    container.innerHTML = "";
    COLORS.forEach(c => {
      const s = document.createElement("div");
      s.className = "swatch" + (c === active ? " selected" : "");
      s.style.background = c;
      s.onclick = () => { onPick(c); [...container.children].forEach(x => x.classList.toggle("selected", x.style.background === c)); };
      container.appendChild(s);
    });
  }
  buildSwatches(el("pickerSwatches"), c => pickerColor = c, pickerColor);

  function hexToRgba(hex, alpha){
    return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16), a: alpha ?? 255 };
  }
  function makePick(modelId, xMM, yMM, zMM){
    return { modelId, positionX: xMM, positionY: yMM, positionZ: zMM, type: "point" };
  }
  async function drawEdgesBatch(modelId, edges, color){
    const defs = edges.map(([a,b]) => ({
      color,
      start: makePick(modelId, a.xMM, a.yMM, a.zMM),
      end: makePick(modelId, b.xMM, b.yMM, b.zMM)
    }));
    try {
      if(API.markup.addLineMarkups){
        const added = await API.markup.addLineMarkups(defs);
        if(added && added.length) return added.map(m=>m&&m.id).filter(Boolean);
      }
    } catch(err){ log("addLineMarkups misslyckades:", err.message||err); }
    try {
      const added = await API.markup.addArrowMarkups(defs);
      if(added && added.length) return added.map(m=>m&&m.id).filter(Boolean);
    } catch(err){ log("addArrowMarkups misslyckades också:", err.message||err); }
    return [];
  }
  async function removeMarkupIds(ids){
    const clean = (ids||[]).filter(Boolean);
    if(clean.length && API){ try{ await API.markup.removeMarkups(clean); }catch(e){} }
  }

  // ---------------- Fetching real object properties (no hardcoded names) ----------------

  // Returns { title, className, psets: [{name, properties:[{name,value}]}] }
  // psets/property names come straight from the model — nothing hardcoded.
  async function fetchObjectProperties(modelId, objectRuntimeId){
    const res = await API.viewer.getObjectProperties(modelId, [objectRuntimeId]);
    const obj = res && res[0];
    if(!obj) return null;
    const psets = [];
    // A synthetic "Allmänt" group for the few fields the API surfaces at the
    // top level (not inside a property set) — still real object data, just
    // not nested, so it's included the same way as everything else.
    const general = [];
    if(obj.class) general.push({ name: "Klass (IFC-typ)", value: obj.class });
    if(obj.product && obj.product.name) general.push({ name: "Namn", value: obj.product.name });
    if(general.length) psets.push({ name: "Allmänt", properties: general });
    (obj.properties || []).forEach(set => {
      const properties = (set.properties || [])
        .filter(p => p && p.name != null)
        .map(p => ({ name: p.name, value: p.value }));
      if(properties.length) psets.push({ name: set.name || "Egenskaper", properties });
    });
    const title = (obj.product && obj.product.name) || obj.class || ("Objekt " + objectRuntimeId);
    return { title, className: obj.class || "", psets };
  }

  async function fetchBoundingBoxCenter(modelId, objectRuntimeId){
    const boxes = await API.viewer.getObjectBoundingBoxes(modelId, [objectRuntimeId]);
    const box = boxes && boxes[0] && boxes[0].boundingBox;
    if(!box) return null;
    return {
      xMM: (box.min.x + box.max.x) / 2 * 1000,
      yMM: (box.min.y + box.max.y) / 2 * 1000,
      zMM: (box.min.z + box.max.z) / 2 * 1000
    };
  }

  // ---------------- Property picker (create & edit share this UI) ----------------

  function keyOf(psetName, propName){ return psetName + "||" + propName; }

  function openPickerForCreate(){
    if(!API) return;
    log("btnCreate klickad, hämtar markering…");
    API.viewer.getSelection().then(async sel => {
      log("getSelection gav:", sel);
      if(!sel || !sel.length){
        alert("Välj minst ett objekt i 3D-vyn först, klicka sedan \"+ Skapa label\" igen.");
        return;
      }
      pickerMode = "create";
      editingLabel = null;
      pickerObjects = [];
      for(const s of sel){
        const modelId = s.modelId;
        for(const objectRuntimeId of (s.objectRuntimeIds || [])){
          try {
            log("Hämtar egenskaper för", modelId, objectRuntimeId);
            const info = await fetchObjectProperties(modelId, objectRuntimeId);
            log("Egenskaper hämtade, antal property sets:", info ? info.psets.length : 0);
            if(info) pickerObjects.push({ modelId, objectRuntimeId, ...info });
          } catch(err){ log("getObjectProperties misslyckades för", modelId, objectRuntimeId, ":", err.message||err); }
        }
      }
      if(!pickerObjects.length){ alert("Kunde inte läsa egenskaper för det markerade — se 🐞 Rådata."); return; }
      pickerSelectedKeys = new Set();
      // Sensible defaults: pre-check "Namn" and "Klass" if present on every object.
      pickerObjects.forEach(o => o.psets.forEach(ps => {
        if(ps.name === "Allmänt") ps.properties.forEach(p => pickerSelectedKeys.add(keyOf(ps.name, p.name)));
      }));
      el("pickerTitle").textContent = `Välj egenskaper (${pickerObjects.length} objekt markerade)`;
      renderPicker();
      pickerEl.classList.add("open");
    });
  }

  function openPickerForEdit(lbl){
    pickerMode = "edit";
    editingLabel = lbl;
    fetchObjectProperties(lbl.modelId, lbl.objectRuntimeId).then(info => {
      if(!info){ alert("Kunde inte läsa objektets egenskaper längre — objektet kan ha tagits bort ur modellen."); return; }
      pickerObjects = [{ modelId: lbl.modelId, objectRuntimeId: lbl.objectRuntimeId, ...info }];
      pickerSelectedKeys = new Set(lbl.selectedKeys);
      pickerColor = lbl.color;
      buildSwatches(el("pickerSwatches"), c => pickerColor = c, pickerColor);
      el("pickerTitle").textContent = "Redigera label — " + info.title;
      renderPicker();
      pickerEl.classList.add("open");
    });
  }

  function renderPicker(){
    el("pickerObjList").textContent = "Objekt: " + pickerObjects.map(o => o.title).join(", ");
    // Union of all property-set/property names across selected objects,
    // straight from what the model actually returned.
    const groups = new Map(); // psetName -> Set(propName)
    pickerObjects.forEach(o => o.psets.forEach(ps => {
      if(!groups.has(ps.name)) groups.set(ps.name, new Map());
      ps.properties.forEach(p => groups.get(ps.name).set(p.name, p.value));
    }));
    const wrap = el("pickerGroups");
    wrap.innerHTML = "";
    for(const [psetName, propMap] of groups){
      const g = document.createElement("div");
      g.className = "psetGroup";
      const bodyId = "pg_" + Math.random().toString(36).slice(2,8);
      g.innerHTML = `<div class="psetHead">${psetName} <span style="font-weight:400;color:var(--text-muted);">▾</span></div><div class="psetBody" id="${bodyId}"></div>`;
      const body = g.querySelector(".psetBody");
      for(const [propName, sampleValue] of propMap){
        const key = keyOf(psetName, propName);
        const row = document.createElement("label");
        row.className = "propRow";
        row.style.cursor = "pointer";
        row.innerHTML = `<input type="checkbox" ${pickerSelectedKeys.has(key)?"checked":""}/> <span>${propName}</span><span class="pval">${sampleValue ?? ""}</span>`;
        row.querySelector("input").onchange = (e) => {
          if(e.target.checked) pickerSelectedKeys.add(key); else pickerSelectedKeys.delete(key);
        };
        body.appendChild(row);
      }
      g.querySelector(".psetHead").onclick = () => { body.style.display = body.style.display === "none" ? "block" : "none"; };
      wrap.appendChild(g);
    }
  }

  el("btnPickerCancel").onclick = () => { pickerEl.classList.remove("open"); moveTargetLabel = null; };

  el("btnPickerSave").onclick = async () => {
    if(!pickerSelectedKeys.size){ alert("Välj minst en egenskap."); return; }
    pickerEl.classList.remove("open");
    if(pickerMode === "edit" && editingLabel){
      editingLabel.selectedKeys = new Set(pickerSelectedKeys);
      editingLabel.color = pickerColor;
      await redrawLabel(editingLabel, /*refetch*/ true);
      renderLabelList();
      return;
    }
    for(const o of pickerObjects){
      log("Skapar label för", o.title, "— hämtar bounding box…");
      const anchor = await fetchBoundingBoxCenter(o.modelId, o.objectRuntimeId);
      log("Bounding box-center:", anchor);
      if(!anchor){ log("Ingen bounding box för", o.title, "— hoppar."); continue; }
      const lbl = {
        id: nextLabelId++,
        modelId: o.modelId,
        objectRuntimeId: o.objectRuntimeId,
        title: o.title,
        color: pickerColor,
        selectedKeys: new Set([...pickerSelectedKeys].filter(k => o.psets.some(ps => ps.properties.some(p => keyOf(ps.name,p.name) === k)))),
        anchor,
        offset: { xMM: 0, yMM: 0, zMM: 900 }, // label floats 0.9 m above the object by default
        visible: true,
        markupIds: [],
        lastValues: [] // [{label, value}] snapshot shown in the list panel
      };
      labels.push(lbl);
      await redrawLabel(lbl, /*refetch*/ false, o.psets);
    }
    renderLabelList();
  };

  // ---------------- Drawing a label as stacked text lines + a small anchor cross ----------------

  async function redrawLabel(lbl, refetch, knownPsets){
    await removeMarkupIds(lbl.markupIds);
    lbl.markupIds = [];
    if(!lbl.visible) { renderLabelList(); return; }

    let psets = knownPsets;
    if(refetch || !psets){
      const info = await fetchObjectProperties(lbl.modelId, lbl.objectRuntimeId).catch(err => { log("Uppdatering misslyckades:", err.message||err); return null; });
      if(info){ psets = info.psets; lbl.title = info.title; }
      else psets = [];
    }

    const lines = [];
    for(const key of lbl.selectedKeys){
      const [psetName, propName] = key.split("||");
      const pset = (psets||[]).find(p => p.name === psetName);
      const prop = pset && pset.properties.find(p => p.name === propName);
      if(prop) lines.push({ label: propName, value: prop.value });
    }
    lbl.lastValues = lines;

    if(el("testModeNoDraw").checked){
      log("🧪 Testläge aktivt — ritar INGET i 3D-vyn, bara datan hämtad.");
      renderLabelList();
      return;
    }

    const rgba = hexToRgba(lbl.color);
    const base = { xMM: lbl.anchor.xMM + lbl.offset.xMM, yMM: lbl.anchor.yMM + lbl.offset.yMM, zMM: lbl.anchor.zMM + lbl.offset.zMM };
    function truncate(s, max){
      s = String(s ?? "–");
      return s.length > max ? s.slice(0, max-1) + "…" : s;
    }
    const textLines = [{ zOffset: 0, text: "🏷️ " + truncate(lbl.title, 28) }];
    lines.forEach((ln, i) => textLines.push({ zOffset: -(i+1)*280, text: truncate(`${ln.label}: ${ln.value ?? "–"}`, 32) }));

    // One addTextMarkup call PER LINE — batching several text entries into a
    // single call crashed the whole 3D viewer in testing (needed an F5 to
    // recover), unlike line/arrow markups which handle batches fine.
    for(const tl of textLines){
      log("Ritar textrad:", tl.text);
      try {
        const added = await API.markup.addTextMarkup([{
          color: rgba,
          start: makePick(lbl.modelId, base.xMM, base.yMM, base.zMM + tl.zOffset),
          text: tl.text
        }]);
        if(added && added[0] && added[0].id) lbl.markupIds.push(added[0].id);
        log("Textrad klar.");
      } catch(err){ log("addTextMarkup misslyckades för rad:", tl.text, err.message||err); }
    }

    // Leader arrow to the object itself (dropped the extra "cross" markup —
    // mixing text + line + arrow markups back-to-back for the same object
    // crashed the whole 3D viewer in testing; keeping this to a single
    // extra call to isolate whether arrows specifically are the problem).
    const c = lbl.anchor;
    log("Ritar ledartråd (arrow) till objektet…");
    try {
      const arrow = await API.markup.addArrowMarkups([{ color: rgba, start: makePick(lbl.modelId, base.xMM, base.yMM, base.zMM), end: makePick(lbl.modelId, c.xMM, c.yMM, c.zMM) }]);
      if(arrow && arrow[0] && arrow[0].id) lbl.markupIds.push(arrow[0].id);
      log("Ledartråd klar.");
    } catch(err){ log("Ledartråd (arrow) misslyckades:", err.message||err); }

    renderLabelList();
  }

  // ---------------- List panel: view, edit, move, hide, delete, update ----------------

  function renderLabelList(){
    el("lblCount").textContent = `${labels.length} label${labels.length===1?"":"s"}`;
    const list = el("list");
    list.innerHTML = "";
    if(!labels.length){
      list.innerHTML = '<div class="empty">Inga labels ännu.<br/>Markera ett objekt i 3D-vyn och klicka "+ Skapa label".</div>';
      return;
    }
    labels.forEach(lbl => {
      const card = document.createElement("div");
      card.className = "lbl-card" + (lbl.visible ? "" : " hidden-label");
      card.style.setProperty("--card-color", lbl.color);
      const rows = lbl.lastValues.map(v => `<div><span>${v.label}</span><span class="v">${v.value ?? "–"}</span></div>`).join("");
      card.innerHTML = `
        <div class="head"><span class="title">🏷️ ${lbl.title}</span></div>
        <div class="body">${rows || '<div style="color:var(--text-muted)">Inga egenskaper valda</div>'}</div>
        <div class="foot">
          <button data-act="edit">✏️ Redigera</button>
          <button data-act="move">📍 Flytta</button>
          <button data-act="toggle">${lbl.visible ? "🙈 Dölj" : "👁 Visa"}</button>
          <button data-act="refresh">🔄 Uppdatera</button>
          <button data-act="del">Ta bort</button>
        </div>
      `;
      card.querySelector('[data-act="edit"]').onclick = () => openPickerForEdit(lbl);
      card.querySelector('[data-act="move"]').onclick = () => {
        moveTargetLabel = lbl;
        alert(`Klicka nu på den nya platsen i 3D-vyn för "${lbl.title}".`);
      };
      card.querySelector('[data-act="toggle"]').onclick = async () => {
        lbl.visible = !lbl.visible;
        await redrawLabel(lbl, false, null);
      };
      card.querySelector('[data-act="refresh"]').onclick = () => redrawLabel(lbl, true, null);
      card.querySelector('[data-act="del"]').onclick = async () => {
        if(!confirm(`Ta bort label "${lbl.title}"?`)) return;
        await removeMarkupIds(lbl.markupIds);
        labels = labels.filter(x => x.id !== lbl.id);
        renderLabelList();
      };
      list.appendChild(card);
    });
  }

  el("btnCreate").onclick = openPickerForCreate;
  el("btnUpdateAll").onclick = async () => {
    for(const lbl of labels) await redrawLabel(lbl, true, null);
  };

  // ---------------- Workspace connection & pick routing (for "Flytta") ----------------

  function extractPickPoint(data){
    if(!data) return null;
    const p = data.position || data.point || data.hitPoint || data;
    if(!p) return null;
    const x = p.x ?? p.positionX, y = p.y ?? p.positionY, z = p.z ?? p.positionZ;
    if(x===undefined||y===undefined||z===undefined) return null;
    return { xMM:x*1000, yMM:y*1000, zMM:z*1000, modelId: data.modelId||(data.model&&data.model.id)||currentModelIdGuess };
  }

  async function onWorkspaceEvent(event, data){
    if(event === "viewer.onModelStateChanged" && data && data.data){
      const d = data.data;
      if(Array.isArray(d) && d[0] && d[0].modelId) currentModelIdGuess = d[0].modelId;
      else if(d.modelId) currentModelIdGuess = d.modelId;
    }
    if(event === "viewer.onPicked" && moveTargetLabel){
      log("onPicked (flytta label):", data);
      const point = extractPickPoint(data && data.data ? data.data : data);
      if(!point){ log("Kunde inte tolka klickpunkten."); return; }
      moveTargetLabel.anchor = { xMM: point.xMM, yMM: point.yMM, zMM: point.zMM };
      const lbl = moveTargetLabel;
      moveTargetLabel = null;
      await redrawLabel(lbl, false, null);
    }
  }

  async function init(){
    try {
      API = await TrimbleConnectWorkspace.connect(window.parent, onWorkspaceEvent, 20000);
      statusEl.textContent = "Ansluten";
      try {
        const sel = await API.viewer.getSelection();
        if(sel && sel[0]) currentModelIdGuess = sel[0].modelId;
      } catch(e){}
      if(!currentModelIdGuess){
        for(const fn of ["getModels","getLoadedModels"]){
          try {
            if(API.viewer[fn]){
              const models = await API.viewer[fn]();
              const list = Array.isArray(models) ? models : (models?[models]:[]);
              if(list.length && list[0] && list[0].modelId){ currentModelIdGuess = list[0].modelId; break; }
              if(list.length && list[0] && list[0].id){ currentModelIdGuess = list[0].id; break; }
            }
          } catch(err){ log(fn+"() misslyckades:", err.message||err); }
        }
      }
    } catch(err){
      statusEl.textContent = "Kunde inte ansluta";
      console.error(err);
    }
  }

  renderLabelList();
  init();
})();
</script>
</body>
</html>
